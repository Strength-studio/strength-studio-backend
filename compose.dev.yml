services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: strength_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      STUDIO_API_PASSWORD: ${STUDIO_API_PASSWORD:?Set STUDIO_API_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/01-local-roles.sh:/docker-entrypoint-initdb.d/01-local-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d strength_studio"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
